# IPLMS AI gateway — development static configuration.
# The dashboard and full trace sampling are intentionally dev-only.

global:
  checkNewVersion: false
  sendAnonymousUsage: false

api:
  dashboard: true
  insecure: true

ping:
  entryPoint: traefik

entryPoints:
  rest:
    address: ":8000"
  grpc:
    address: ":50051"
  traefik:
    address: ":8080"
  metrics:
    address: ":8082"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false

log:
  level: INFO
  format: json

accessLog:
  format: json
  fields:
    defaultMode: keep
    names:
      ClientHost: drop
    headers:
      defaultMode: drop

metrics:
  prometheus:
    entryPoint: metrics
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true

tracing:
  serviceName: iplms-ai-gateway
  sampleRate: 1.0
  otlp:
    http:
      endpoint: http://tempo:4318/v1/traces
