# ==============================================================================
# IPLMS — AI Service Production Override (docker-compose.production.yml)
#
# Cấu hình override cho môi trường production (đồng bộ cách đặt tên chuẩn với backend).
#
# Cách dùng:
#   docker compose --env-file .env.prod -f docker-compose.yml -f docker-compose.production.yml up -d --no-build
# ==============================================================================

services:
  api:
    image: ${AI_IMAGE:-iplms-ai:latest}
    build: !reset null
    restart: always
    env_file: !override
      - path: .env.prod
        required: true
    environment:
      - AI_LOG_LEVEL=INFO
      - AI_OBJECT_STORAGE_ALLOW_INSECURE_HTTP=false
      - AI_RELOAD=false
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 512M

  database-vector:
    restart: always

  gateway:
    restart: always
    volumes:
      - ./docker/traefik/traefik.production.yml:/etc/traefik/traefik.yml:ro
