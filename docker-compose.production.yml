# ==============================================================================
# IPLMS — AI Service Production Override (docker-compose.production.yml)
#
# File này tương đương với docker-compose.prod.yml (đồng bộ cách đặt tên với backend).
#
# Cách dùng:
#   docker compose -f docker-compose.yml -f docker-compose.production.yml up -d --no-build
# ==============================================================================

services:
  ai:
    container_name: ${COMPOSE_PROJECT_NAME:-iplms-ai-prod}-service
    image: ${AI_IMAGE:-iplms-ai:latest}
    build: !reset null
    restart: always
    env_file:
      - path: .env.production
        required: false
    environment:
      - AI_LOG_LEVEL=INFO
      - AI_OBJECT_STORAGE_ALLOW_INSECURE_HTTP=false
      - AI_RELOAD=false
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 512M
