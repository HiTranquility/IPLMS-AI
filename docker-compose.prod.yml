# ==============================================================================
# IPLMS — AI Service Production Override (docker-compose.prod.yml)
#
# Chạy chồng lên docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-build
#
# Đặc điểm môi trường Production:
#   - Dùng image đóng gói sẵn `${AI_IMAGE:-iplms-ai:latest}` (ECR/Registry).
#   - Bỏ qua build cục bộ (`build: !reset null`).
#   - KHÔNG mount mã nguồn `./app` (đảm bảo container bất biến, đúng artifact CI/CD).
#   - Giới hạn tài nguyên (Resource Limits): 1.00 CPU, 2GB RAM.
#   - Tự khởi động lại khi crash (`restart: always`).
#   - Nạp file cấu hình production nếu có (`.env.production`).
# ==============================================================================

services:
  ai:
    container_name: ${COMPOSE_PROJECT_NAME:-iplms-ai-prod}-service
    image: ${AI_IMAGE:-iplms-ai:latest}
    build: !reset null
    restart: always
    env_file:
      - path: .env.production
        required: false
    environment:
      - AI_LOG_LEVEL=INFO
      - AI_OBJECT_STORAGE_ALLOW_INSECURE_HTTP=false
      - AI_RELOAD=false
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 512M
