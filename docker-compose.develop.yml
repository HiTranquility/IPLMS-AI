# ==============================================================================
# IPLMS — AI Service Develop Override (docker-compose.develop.yml)
#
# Cấu hình override cho môi trường develop (đồng bộ cách đặt tên chuẩn với backend).
#
# Cách dùng:
#   docker compose -f docker-compose.yml -f docker-compose.develop.yml up -d
# ==============================================================================

services:
  ai:
    restart: "no"
    env_file:
      - path: .env
        required: false
    environment:
      - AI_LOG_LEVEL=${AI_LOG_LEVEL:-DEBUG}
      - PYTHONUNBUFFERED=1
      - AI_RELOAD=true
    volumes:
      # Mount mã nguồn trực tiếp để phản ánh thay đổi ngay lập tức
      - ./app:/app/app
      - ./training:/app/training:ro
      - ./test:/app/test:ro
      - ./docker-entrypoint.sh:/usr/local/bin/docker-entrypoint.sh:ro

  ai-db:
    restart: "no"

  gateway:
    restart: "no"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.develop.yml:/etc/traefik/traefik.yml:ro
    healthcheck:
      # In dev, prove that the Docker provider discovered the REST router.
      test:
        [
          "CMD-SHELL",
          "wget --spider -q 'http://127.0.0.1:8080/api/http/routers/ai-rest@docker'",
        ]
