# ==============================================================================
# IPLMS — AI Service Develop Override (docker-compose.develop.yml)
#
# Cấu hình override cho môi trường develop (đồng bộ cách đặt tên chuẩn với backend).
#
# Cách dùng:
#   docker compose --env-file .env.dev -f docker-compose.yml -f docker-compose.develop.yml up -d
# ==============================================================================

services:
  ai:
    # Dev image is built from this checkout; do not probe a private registry first.
    pull_policy: build
    build:
      args:
        PRELOAD_EASYOCR_MODELS: "false"
    restart: "no"
    environment:
      - AI_LOG_LEVEL=${AI_LOG_LEVEL:-DEBUG}
      - PYTHONUNBUFFERED=1
      - AI_RELOAD=true
      - AI_COMPILE_PROTO_ON_START=true
      - AI_VISION_WARMUP_ON_START=false
      - AI_OCR_MODEL_STORAGE_DIR=/app/var/easyocr-cache
    volumes:
      # Mount mã nguồn trực tiếp để phản ánh thay đổi ngay lập tức
      - ./app:/app/app
      - ./training:/app/training:ro
      - ./test:/app/test:ro
      - ./docker-entrypoint.sh:/usr/local/bin/docker-entrypoint.sh:ro
      - ./var/easyocr-cache:/app/var/easyocr-cache

  ai-db:
    restart: "no"

  gateway:
    restart: "no"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker/traefik/traefik.develop.yml:/etc/traefik/traefik.yml:ro
    healthcheck:
      # In dev, prove that the Docker provider discovered the REST router.
      test:
        [
          "CMD-SHELL",
          "wget --spider -q 'http://127.0.0.1:8080/api/http/routers/ai-rest@docker'",
        ]

  ai-console:
    volumes:
      - ./app:/app/app:ro
      - ./ui/dist:/app/ui/dist:ro
