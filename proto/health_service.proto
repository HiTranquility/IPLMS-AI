syntax = "proto3";

// Dùng ĐÚNG package chuẩn `grpc.health.v1` để tương thích dây với
// `grpc_health_probe` và healthcheck của Docker/k8s, mà KHÔNG phải thêm
// dependency `grpcio-health-checking`.
package grpc.health.v1;

service Health {
  rpc Check (HealthCheckRequest) returns (HealthCheckResponse);
}

message HealthCheckRequest {
  string service = 1;  // rỗng = hỏi sức khoẻ toàn server
}

message HealthCheckResponse {
  enum ServingStatus {
    UNKNOWN = 0;
    SERVING = 1;
    NOT_SERVING = 2;
    SERVICE_UNKNOWN = 3;
  }
  ServingStatus status = 1;
}
