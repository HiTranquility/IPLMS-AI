# ==============================================================================
# IPLMS — AI Service Base Orchestration (docker-compose.yml)
#
# Chạy riêng plane AI (FastAPI REST :8000 + gRPC :50051):
#   docker compose --env-file .env.dev up -d
#
# Hoặc chạy kết hợp với cấu hình override theo môi trường:
#   Dev:  docker compose --env-file .env.dev -f docker-compose.yml -f docker-compose.develop.yml up -d
#   Prod: docker compose --env-file .env.prod -f docker-compose.yml -f docker-compose.production.yml up -d
#
# ⚠️ BUILD CONTEXT LÀ GỐC REPO (`context: ..`), không phải thư mục ai/.
# Lý do: hợp đồng `proto/` nằm ở gốc repo và dùng chung với backend (xem PROB-034).
# ==============================================================================

name: ${COMPOSE_PROJECT_NAME:-iplms-ai-dev}

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "3"

services:
  # ─── AI Service (REST :8000 + gRPC :50051) ─────────────────────────────────
  # Tên service theo vai (IPLMS ADR-0055): container tự có tên <project>-api-<n>.
  api:
    build:
      context: ..
      dockerfile: ai/Dockerfile
    image: ${AI_IMAGE:-iplms-ai:latest}
    restart: unless-stopped
    logging: *default-logging
    expose:
      - "8000"
      - "50051"
    depends_on:
      database-vector:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      # bug-031: gateway chỉ nhận container có nhãn này (providers.docker.constraints).
      - "iplms.gateway=ai"
      # Traefik tới api qua mạng riêng của stack (ADR-0055).
      - "traefik.docker.network=${COMPOSE_PROJECT_NAME:-iplms-ai-dev}_default"
      # ── REST Routing (:8000) ──
      - "traefik.http.routers.ai-rest.rule=PathPrefix(`/`)"
      - "traefik.http.routers.ai-rest.entrypoints=rest"
      - "traefik.http.routers.ai-rest.service=ai-rest"
      - "traefik.http.services.ai-rest.loadbalancer.server.port=8000"
      # Traefik tự dò /health từng replica: bỏ replica hỏng sau ~5 s và có metric
      # traefik_service_server_up theo từng replica cho Grafana.
      - "traefik.http.services.ai-rest.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.ai-rest.loadbalancer.healthcheck.interval=5s"
      - "traefik.http.services.ai-rest.loadbalancer.healthcheck.timeout=2s"
      # ── gRPC Routing (:50051) with cleartext HTTP/2 (h2c) ──
      - "traefik.http.routers.ai-grpc.rule=PathPrefix(`/`)"
      - "traefik.http.routers.ai-grpc.entrypoints=grpc"
      - "traefik.http.routers.ai-grpc.service=ai-grpc"
      - "traefik.http.services.ai-grpc.loadbalancer.server.port=50051"
      - "traefik.http.services.ai-grpc.loadbalancer.server.scheme=h2c"
      # Dò grpc.health.v1 (proto/health_service.proto) ngay trên cổng gRPC: bắt được
      # cả tiến trình gRPC treo, không chỉ REST.
      - "traefik.http.services.ai-grpc.loadbalancer.healthcheck.mode=grpc"
      - "traefik.http.services.ai-grpc.loadbalancer.healthcheck.interval=5s"
      - "traefik.http.services.ai-grpc.loadbalancer.healthcheck.timeout=2s"
    env_file:
      - path: .env.dev
        required: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./model/artifacts/bootstrap/anpr:/app/model/artifacts/bootstrap/anpr:ro
      - ./model/checkpoint:/app/model/checkpoint:ro
      - ./var/model-cache:/app/var/model-cache
      - ./static:/app/static
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ─── Dedicated pgvector Database for Copilot Knowledge Base ────────────────
  database-vector:
    image: pgvector/pgvector:0.8.6-pg16-bookworm
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${AI_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${AI_DB_PASSWORD:?Thiếu AI_DB_PASSWORD - đặt trong file --env-file (mẫu .env.example)}
      POSTGRES_DB: ${AI_DB_NAME:-iplms_knowledge}
      # DB riêng của AI Console (ADR-0048 §3); trống thì script init bỏ qua.
      AI_CONSOLE_DB_PASSWORD: ${AI_CONSOLE_DB_PASSWORD:-}
      # Bắt buộc khi đặt AI_CONSOLE_DB_PASSWORD; script init 11 dừng nếu thiếu.
      AI_INFERENCE_DB_PASSWORD: ${AI_INFERENCE_DB_PASSWORD:-}
    ports:
      # Keep the host port distinct from the backend DB (:5433) and the
      # knowledge-graph dev stack (:5434). Containers still use database-vector:5432.
      - "${AI_DB_HOST_PORT:-5435}:5432"
    volumes:
      - database-vector-data:/var/lib/postgresql/data
      - ./docker/database-vector/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AI_DB_USER:-postgres} -d ${AI_DB_NAME:-iplms_knowledge}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── AI Console nội bộ (ADR-0048) ───────────────────────────────────────────
  # Bật bằng `--profile console`. Cùng image với `ai`, process riêng (không chung
  # tải với inference). [NEVER] gắn label Traefik hay publish ra ngoài 127.0.0.1.
  console:
    image: ${AI_IMAGE:-iplms-ai:latest}
    profiles: ["console"]
    restart: unless-stopped
    logging: *default-logging
    entrypoint: ["uvicorn", "app.console_main:app", "--host", "0.0.0.0", "--port", "8090"]
    ports:
      - "127.0.0.1:8090:8090"
      - "127.0.0.1:8095:8090"
    # Giao diện build ở host (`pnpm --dir ui build`); image AI không chứa Node (ADR-0048 §5).
    volumes:
      - ./app:/app/app:ro
      - ./ui/dist:/app/ui/dist:ro
    depends_on:
      database-vector:
        condition: service_healthy
    env_file:
      - path: .env.dev
        required: true
    environment:
      - AI_CONSOLE_DATABASE_URL=postgresql://${AI_DB_USER:-postgres}:${AI_DB_PASSWORD:?Thiếu AI_DB_PASSWORD - đặt trong file --env-file (mẫu .env.example)}@database-vector:5432/ai_console
      - AI_CONSOLE_DEMO_SEED_ENABLED=true
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8090/console/api/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ─── Traefik v3 L7 Gateway & Load Balancer ──────────────────────────────────
  gateway:
    # v3.6.16+ negotiates a modern Docker API; v3.3 falls back to v1.24 and
    # cannot discover routes on Docker Engine 29.
    image: traefik:v3.6.16
    restart: unless-stopped
    logging: *default-logging
    environment:
      - DOCKER_API_VERSION=1.45
    # bug-032: chỉ bind localhost — AI không có xác thực; backend gọi qua alias ai-gateway trên mạng chung.
    ports:
      - "127.0.0.1:${AI_GATEWAY_REST_PORT:-8000}:8000"      # REST Entrypoint
      - "127.0.0.1:${AI_GATEWAY_GRPC_PORT:-50051}:50051"    # gRPC Entrypoint (h2c L7 Load Balanced)
      - "127.0.0.1:${AI_GATEWAY_DASHBOARD_PORT:-8080}:8080" # Web Dashboard UI & API
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
    networks:
      default: {}
      shared:
        aliases:
          - ai-gateway
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8080/ping"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  database-vector-data:
    driver: local

# Mạng riêng <project>_default cho gọi nội bộ; mạng chung do stack backend tạo, chỉ gateway nối vào
# (alias ai-gateway) — IPLMS ADR-0055.
networks:
  shared:
    name: ${SHARED_NETWORK:-iplms-shared-dev}
    external: true
