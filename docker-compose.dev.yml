# ==============================================================================
# IPLMS — AI Service Development Override (docker-compose.dev.yml)
#
# Chạy chồng lên docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Đặc điểm môi trường Dev:
#   - Gắn volume `./app:/app/app` để sửa code là nhận ngay (hot-reload).
#   - Gắn volume `./test:/app/test:ro` để chạy bộ test trực tiếp trong container.
#   - Tự động nạp file `ai/.env` nếu có.
#   - Bật live reload cho FastAPI REST (`AI_RELOAD=true`).
#   - Đặt `AI_LOG_LEVEL=DEBUG` để quan sát chi tiết log xử lý.
#   - `restart: "no"` để dev chủ động start/stop.
# ==============================================================================

services:
  ai:
    container_name: ${COMPOSE_PROJECT_NAME:-iplms-ai-dev}-service
    restart: "no"
    env_file:
      - path: .env
        required: false
    environment:
      - AI_LOG_LEVEL=${AI_LOG_LEVEL:-DEBUG}
      - PYTHONUNBUFFERED=1
      - AI_RELOAD=true
    volumes:
      # Mount mã nguồn trực tiếp để phản ánh thay đổi ngay lập tức
      - ./app:/app/app
      - ./test:/app/test:ro
      - ./docker-entrypoint.sh:/usr/local/bin/docker-entrypoint.sh:ro
