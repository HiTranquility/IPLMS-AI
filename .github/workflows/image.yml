# ============================================================================
# Image — build → quét lỗ hổng → push GHCR (ADR-0006, IPLMS root repo)
#
#   PR vào main/develop : build + quét, KHÔNG push (chặn image lỗi trước khi merge)
#   push main           : push  sha-<7>  +  main
#   push tag vX.Y.Z     : push  X.Y.Z  +  X.Y  +  sha-<7>   (bản phát hành → prod)
#
# [NEVER] tag `latest`. Deploy luôn trỏ sha-<7> hoặc X.Y.Z để trả lời được câu
# "đang chạy mã nào" và rollback = đổi tag.
# Action ghim theo commit SHA (tag có thể bị dời — supply-chain); Trivy ghim digest.
# ============================================================================
name: Image

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/hitranquility/iplms-ai
  TRIVY_IMAGE: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa

jobs:
  image:
    name: Build, scan, push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # ai/Dockerfile dùng context = GỐC repo cha (COPY ai/... + COPY proto). Dựng lại đúng
      # layout đó: repo này vào ./ai, bản proto/ vendor (ADR-0006, PR AI#1) ra ./proto.
      - name: Checkout (as ./ai)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ai

      - name: Recreate monorepo layout (proto/ at context root)
        run: cp -r ai/proto proto

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Image metadata (tags + OCI labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # 1) Build vào docker local để quét TRƯỚC khi push.
      - name: Build (local, for scanning)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ai/Dockerfile
          load: true
          push: false
          tags: scan-target:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2) Cổng lỗ hổng: CRITICAL đã có bản vá → đỏ. HIGH: ghi vào summary, chưa chặn
      #    (ratchet — ISSUE-007). Không dùng trivy-action: chạy image chính chủ ghim digest.
      - name: Trivy — gate on fixable CRITICAL
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image --quiet --scanners vuln --ignore-unfixed --severity CRITICAL \
            --exit-code 1 "scan-target:${{ github.sha }}"

      - name: Trivy — HIGH/CRITICAL report to job summary
        if: always()
        run: |
          {
            echo "### Trivy — ${IMAGE} (HIGH, CRITICAL)"
            echo '```'
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
              image --quiet --scanners vuln --severity HIGH,CRITICAL --format table \
              "scan-target:${{ github.sha }}" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3) Push (cache hit từ bước 1) kèm SBOM + provenance (SLSA) gắn vào manifest.
      - name: Push
        if: github.event_name != 'pull_request'
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ai/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### Pushed ${IMAGE}"
            echo "- digest: \`${{ steps.push.outputs.digest }}\`"
            echo "- tags:"
            echo '${{ steps.meta.outputs.tags }}' | sed 's/^/  - `/; s/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"
