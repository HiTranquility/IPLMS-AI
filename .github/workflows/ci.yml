name: AI · CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ai-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Run Python tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16-bookworm
        env:
          POSTGRES_USER: postgres
          # bug-053: không để mật khẩu literal trong repo — mỗi lượt chạy một giá trị riêng
          # (DB chỉ sống trong job này, chỉ nghe localhost của runner).
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: iplms_knowledge
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      CI_DB_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
      AI_DATABASE_URL: postgresql://postgres:ci-${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/iplms_knowledge
      AI_TEST_DATABASE_URL: postgresql://postgres:ci-${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/iplms_knowledge
      AI_CONSOLE_DATABASE_URL: postgresql://postgres:ci-${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/ai_console
      AI_CONSOLE_INFERENCE_DATABASE_URL: postgresql://ai_inference:ci-${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/ai_console
      AI_CONSOLE_DB_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
      AI_INFERENCE_DB_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            grpcio grpcio-tools numpy opencv-python-headless "pillow>=10.0.0" \
            "fastapi>=0.110" "python-multipart>=0.0.9" "pyarrow>=14.0.0" \
            pydantic pydantic-settings "pypdf>=6.19.0" python-docx \
            "openai>=1.68.0,<2.0.0" "pgvector>=0.2.5" "psycopg2-binary>=2.9.9" \
            "langgraph>=1.2.11,<1.3.0" "langgraph-checkpoint>=4.1.1,<5.0.0" \
            "langgraph-checkpoint-postgres>=3.1.2,<3.2.0" "langgraph-sdk>=0.4.4,<0.5.0" \
            "psycopg[binary,pool]>=3.3.6,<4.0.0" \
            "google-auth>=2.62.0,<3.0.0" "cryptography>=50.0.2" "pyotp==2.9.0" "argon2-cffi==25.1.0"

      - name: Compile protobuf stubs
        run: python app/script/compile_proto.py

      - name: Initialize Postgres databases and vector extension
        run: |
          PGPASSWORD="$CI_DB_PASSWORD" psql -h localhost -U postgres -d iplms_knowledge -c "CREATE EXTENSION IF NOT EXISTS vector;"
          PGPASSWORD="$CI_DB_PASSWORD" psql -h localhost -U postgres -d postgres -c "CREATE DATABASE ai_console;"
          python -m app.script.harden_console_db

      - name: Run unit tests
        run: python -m unittest discover -s test -v

      - name: Compile Python sources
        run: python -m compileall -q app model training test

      # ADR-0005: khuôn domain app/core/ và không có prompt viết cứng.
      - name: Check core layout
        run: |
          python -B -m unittest discover -s script -p test_check_core_layout.py
          python -X utf8 script/check_core_layout.py

  # bug-053: script init chỉ chạy khi volume database-vector còn trống — đúng lúc
  # giảng viên/người mới chạy lần đầu, nên phải kiểm trên volume trống ở mỗi PR.
  db-init:
    name: Check database-vector init on empty volume
    runs-on: ubuntu-latest
    env:
      PW: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start pgvector with repo init scripts
        run: |
          docker run -d --name dbinit \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD="$PW" -e POSTGRES_DB=iplms_knowledge \
            -e AI_CONSOLE_DB_PASSWORD="$PW-console" -e AI_INFERENCE_DB_PASSWORD="$PW-inference" \
            -v "$PWD/docker/database-vector/init:/docker-entrypoint-initdb.d:ro" \
            pgvector/pgvector:0.8.6-pg16-bookworm

      - name: Wait for init to finish
        run: |
          for i in $(seq 1 60); do
            if docker logs dbinit 2>&1 | grep -q 'PostgreSQL init process complete'; then exit 0; fi
            if [ "$(docker inspect -f '{{.State.Running}}' dbinit)" != true ]; then break; fi
            sleep 2
          done
          docker logs dbinit 2>&1 | tail -40
          exit 1

      - name: ai_inference can log in to ai_console
        run: |
          for i in $(seq 1 30); do docker exec dbinit pg_isready -h 127.0.0.1 -U postgres && break; sleep 1; done
          docker exec -e PGPASSWORD="$PW-inference" dbinit \
            psql -h 127.0.0.1 -U ai_inference -d ai_console -tAc "select current_user" | grep -qx ai_inference

  ui:
    name: Build AI Console UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Phiên bản pnpm lấy từ `packageManager` trong ui/package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json

      # undici (qua jsdom của vitest) cần zlib zstd ở Node 22.15 trở lên.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
