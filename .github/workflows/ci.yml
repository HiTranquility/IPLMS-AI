name: AI CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ai-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            grpcio grpcio-tools numpy opencv-python-headless \
            pydantic pydantic-settings "pypdf>=6.19.0" python-docx

      - name: Compile protobuf stubs
        run: python app/script/compile_proto.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: python -m compileall -q app training tests
