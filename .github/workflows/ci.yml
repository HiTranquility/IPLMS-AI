name: AI · CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ai-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Run Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            grpcio grpcio-tools numpy opencv-python-headless \
            "fastapi>=0.110" "python-multipart>=0.0.9" "pyarrow>=14.0.0" \
            pydantic pydantic-settings "pypdf>=6.19.0" python-docx \
            "openai>=1.68.0,<2.0.0" "pgvector>=0.2.5" "psycopg2-binary>=2.9.9" \
            "langgraph>=1.2.11,<1.3.0" "langgraph-checkpoint>=4.1.1,<5.0.0" \
            "langgraph-checkpoint-postgres>=3.1.2,<3.2.0" "langgraph-sdk>=0.4.4,<0.5.0" \
            "psycopg[binary,pool]>=3.3.6,<4.0.0" \
            "google-auth>=2.62.0,<3.0.0" "cryptography>=50.0.2" "pyotp==2.9.0" "argon2-cffi==25.1.0"

      - name: Compile protobuf stubs
        run: python app/script/compile_proto.py

      - name: Run unit tests
        run: python -m unittest discover -s test -v

      - name: Compile Python sources
        run: python -m compileall -q app model training test

  ui:
    name: Build AI Console UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Phiên bản pnpm lấy từ `packageManager` trong ui/package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json

      # undici (qua jsdom của vitest) cần zlib zstd — Node 22.15 trở lên.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
